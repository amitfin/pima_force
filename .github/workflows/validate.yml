name: Validate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs: # https://github.com/hacs/action
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  test:
    name: Tests (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Its version pins the Home Assistant version. Keep the minimum in sync
          # with "homeassistant" in hacs.json.
          - homeassistant: minimum
            pytest-homeassistant-custom-component: "0.13.371"
          - homeassistant: latest
            pytest-homeassistant-custom-component: ""
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install requirements
        run: scripts/setup ${{ matrix.pytest-homeassistant-custom-component }}

      - name: Check the minimum Home Assistant version
        if: matrix.homeassistant == 'minimum'
        run: |
          python - <<'EOF'
          import json
          from importlib.metadata import version

          expected = json.load(open("hacs.json"))["homeassistant"]
          installed = version("homeassistant")
          assert installed == expected, f"Installed {installed}, hacs.json {expected}"
          print(f"Home Assistant {installed}")
          EOF

      - name: Run
        run: pytest
